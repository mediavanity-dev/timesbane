# Builds the iOS app on a GitHub-hosted Mac, signs it, and uploads it to
# App Store Connect (it then shows up in TestFlight). Run it from the
# Actions tab: "iOS → TestFlight" → Run workflow.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID          10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID             App Store Connect API key ID
#   ASC_ISSUER_ID          App Store Connect API issuer ID
#   ASC_KEY_P8             Full contents of the AuthKey_XXXX.p8 file
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Mac runner (xcode-27 = iOS 27 SDK, required from April 2027; macos-26 or macos-26-intel when xcode-27 machines are unavailable)'
        default: xcode-27
        type: choice
        options: [xcode-27, macos-26, macos-26-intel]

jobs:
  build:
    # Apple requires uploads built with the iOS 27 SDK (Xcode 27) from April 2027 (ITMS-90725).
    # GitHub's macos-26 images stop at Xcode 26.x; the xcode-27 image (Apple silicon, preview
    # in Nov 2026) has Xcode 27. When a newer image is announced, move to it the same way.
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 45
    env:
      MIN_IOS_SDK: ${{ (inputs.runner || 'xcode-27') == 'xcode-27' && '27' || '26' }}   # raise when Apple announces the next required SDK
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build web app
        run: |
          npm ci
          npm run build
          npx cap sync ios

      # The widget extension is a second target; there is no Xcode on Windows to add it, so it is added here.
      - name: Add the widget extension
        run: |
          gem install xcodeproj --no-document --user-install
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"
          ruby -e "require 'xcodeproj'; puts Xcodeproj::VERSION" || true
          ruby scripts/add-widget-target.rb

      # Use the newest Xcode on the image (the default is often an older one), and stop before
      # building if its iOS SDK is older than Apple requires, rather than upload and get ITMS-90725.
      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK $SDK from $XCODE"
          if [ "${SDK%%.*}" -lt "$MIN_IOS_SDK" ]; then
            echo "::error::iOS SDK $SDK is older than the required $MIN_IOS_SDK; pick a runner image with a newer Xcode"
            exit 1
          fi

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      # Archived unsigned: signing for the archive would need a development
      # profile, which Apple only issues to teams with a registered device.
      # The export step below signs it for the App Store with Apple's
      # cloud-managed distribution certificate instead.
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ios/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

# Run from the Actions tab or: gh workflow run ios-testflight.yml -f runner=macos-26-intel
