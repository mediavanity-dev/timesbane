/* ==========================================================================
   Confused & Amused

   ========================================================================== */

// ---------- small things ----------

// ---------- context: when and (roughly) where you are, without asking ----------

const pastStrokes = MEM.strokes.slice();

// The only record of a discovery is a gold star in the night sky of Absence.
function found(id) { const first = !MEM.found[id]; if (first) { MEM.found[id] = Date.now(); saveMem(); } return first; }
const SESSION = {};
// mirror minutes: 1:11, 2:22, 3:33, 4:44, 5:55, 10:10, 11:11, 12:12
const TWIN = (() => { const d = new Date(), h = d.getHours() % 12 || 12, m = d.getMinutes(), t = `${h}${String(m).padStart(2, '0')}`; return new Set(t).size === 1 || (h >= 10 && h === m); })();

saveMem();
setInterval(() => { if (!document.hidden) { MEM.total += 5; saveMem(); } }, 5000);
addEventListener('pagehide', saveMem);

// Gestures are recorded so that, later, a ghost of you can perform them.
const REC = {
  cur: null, id: null, session: [],
  start(p) { this.id = p.id; this.cur = { pts: [[p.x / W, p.y / H, 0]], t0: performance.now(), lt: 0 }; },
  move(p) {

    const tt = performance.now() - c.t0; if (tt - c.lt < 33 || c.pts.length > 240) return;

    if (!c || c.pts.length < 4) return;

class Ghost {
  constructor() { this.x = -999; this.y = -999; this.px = 0; this.py = 0; this.down = false; this.started = false; this.wait = rand(1.5, 4); this.s = null; this.i = 0; this.t = 0; }

// ---------- sound ----------

}
function goBack() { if (HIST.length && phase !== 'out') go(HIST.pop(), true); }
function randomOther() { let i; do { i = Math.random() * MOVES.length | 0; } while (i === curI && MOVES.length > 1); return i; }
const whoosh = back => S.noise({ rev: !back, dur: .5, f: 3000, ft: 'lowpass', g: .08 });
// hidden doors
let swipe = null, door = null;
function begin(i) { started = true; enterMove(i); phase = 'in'; fade = 1; document.getElementById('nx').classList.add('on'); document.getElementById('sd').classList.add('on'); }

const hashM = /^#m(\d{1,2})$/.exec(location.hash);
if (hashM && +hashM[1] < MOVES.length) { begin(+hashM[1]); }

function ignite() {
  if (ign >= 0 || started) return;
  ign = 0;
  S.init();
  if (TWIN) found('twin');
  try { if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (e) {}
  try { if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') DeviceMotionEvent.requestPermission().catch(() => {}); } catch (e) {}
  S.note(mtof(62), { g: .12, d: 3.5 }); S.note(mtof(69), { g: .08, d: 3.5, at: .18 }); S.note(mtof(74), { g: .05, d: 4, at: .36 });
  buzz(18);
}
function intro(dt) {
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.fillStyle = '#050407'; g.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, br = .5 + .5 * Math.sin(T * 1.6);
  const n = Math.min(MEM.visits - 1, 40);
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + T * .05, r = 42 + (i % 3) * 15;
    g.fillStyle = 'rgba(236,228,214,.25)'; g.fillRect(cx + Math.cos(a) * r - .8, cy + Math.sin(a) * r - .8, 1.6, 1.6);
  }
  if (ign < 0) {
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, 34 + br * 10);
    gr.addColorStop(0, `rgba(255,120,80,${.18 + br * .1})`); gr.addColorStop(1, 'rgba(255,120,80,0)');
    g.fillStyle = gr; g.fillRect(cx - 50, cy - 50, 100, 100);
    if (TWIN) for (const sgn of [-1, 1]) { g.fillStyle = '#f3ebdf'; g.beginPath(); g.arc(cx + Math.cos(T * .9) * 12 * sgn, cy + Math.sin(T * .9) * 12 * sgn, 2.6 + br, 0, TAU); g.fill(); }
    else { g.fillStyle = '#f3ebdf'; g.beginPath(); g.arc(cx, cy, 3 + br * 1.3, 0, TAU); g.fill(); }
    if (T > 5) {
      const k = (T % 4.5) / 4.5;
      g.strokeStyle = `rgba(236,228,214,${(1 - k) * .22})`; g.lineWidth = 1;
      g.beginPath(); g.arc(cx, cy, 8 + k * 70, 0, TAU); g.stroke();
    }
  } else {
    ign += dt;
    const k = Math.min(1, ign / 1.4), R = k * k * Math.hypot(W, H) * .6;
    g.strokeStyle = `rgba(243,235,223,${1 - k})`; g.lineWidth = 1 + 18 * (1 - k);
    g.beginPath(); g.arc(cx, cy, R + 3, 0, TAU); g.stroke();
    g.fillStyle = `rgba(243,235,223,${1 - k})`; g.beginPath(); g.arc(cx, cy, 4 * (1 - k), 0, TAU); g.fill();
    if (k >= 1) begin(firstIdx());
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 1 / 60; if (dt > .1) dt = .1;
  // when the phone is nearly out of battery, the piece is tired too
  const tired = !!(BAT && !BAT.charging && BAT.level < .15);
  if (tired) { dt *= .65; if (started && !SESSION.tired) { SESSION.tired = true; found('tired'); } }
  T += dt;
  if (hasTilt) { TILT.x = lerp(TILT.x, tiltRaw.x, .08); TILT.y = lerp(TILT.y, tiltRaw.y, .08); TILT.rx = TILT.x; TILT.ry = TILT.y; }
  else if (HOVER.t > 0) { TILT.x = lerp(TILT.x, (HOVER.x / W - .5) * .8, .04); TILT.y = lerp(TILT.y, (HOVER.y / H - .5) * .8, .04); }
  if (!started) { intro(dt); return; }
  cur.frame(dt);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  if (phase === 'out') { fade = Math.min(1, fade + dt / 1.1); if (fade >= 1) { enterMove(nextI); phase = 'in'; } }
  else if (phase === 'in') { fade = Math.max(0, fade - dt / 1.6); if (fade <= 0) phase = 'idle'; }
  if (fade > 0) { g.fillStyle = `rgba(5,4,7,${easeIO(fade)})`; g.fillRect(0, 0, W, H); }
  if (door) {
    const p = P.get(door.id);
    if (!p || p.moved > 14 || phase !== 'idle') door = null;
    else {
      const k = (T - door.t - .3) / 1.5;
      if (k > 0) {
        g.strokeStyle = cur.paper ? 'rgba(26,22,32,.5)' : 'rgba(236,228,214,.5)'; g.lineWidth = 1.2;
        g.beginPath(); g.arc(30, 30, 14 * (1 - k * .5), -Math.PI / 2, -Math.PI / 2 + TAU * Math.min(1, k)); g.stroke();
      }
      if (k >= 1) { door = null; buzz(25); S.bell(scaleNote(62, 9), 0, .5); go(randomOther()); }
    }
  }
  if (tired) { g.fillStyle = 'rgba(5,4,7,.12)'; g.fillRect(0, 0, W, H); }
  if (phase === 'idle' && T - mStart > cur.dur && T - lastInput > 6 && !P.size) go(nextIdx());
}
requestAnimationFrame(loop);

// ---------- wiring ----------
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!started) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = { id: e.pointerId, x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, dx: 0, dy: 0, sx: e.clientX, sy: e.clientY, t0: T, moved: 0 };
  P.set(e.pointerId, p); lastInput = T;
  if (P.size === 1) REC.start(p);
  if (P.size === 2) { const [a, b] = [...P.values()]; swipe = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, t: T, done: false }; }
  else if (P.size > 2) swipe = null;
  if (P.size === 1 && p.x < 64 && p.y < 64) door = { id: p.id, t: T };
  const dbl = T - lastDown.t < .32 && Math.hypot(p.x - lastDown.x, p.y - lastDown.y) < 50;
  lastDown = { t: T, x: p.x, y: p.y };
  if (phase === 'out') return;
  if (cur.down) cur.down(p);
  if (dbl && cur.dbl) cur.dbl(p);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { HOVER.x = e.clientX; HOVER.y = e.clientY; HOVER.t = T; }
  const p = P.get(e.pointerId); if (!p) return;
  p.px = p.x; p.py = p.y; p.x = e.clientX; p.y = e.clientY; p.dx = p.x - p.px; p.dy = p.y - p.py;
  p.moved += Math.hypot(p.dx, p.dy); lastInput = T;
  REC.move(p);
  if (swipe && !swipe.done && P.size === 2 && phase === 'idle') {
    const [a, b] = [...P.values()], dx = (a.x + b.x) / 2 - swipe.x, dy = (a.y + b.y) / 2 - swipe.y;
    if (T - swipe.t < .9 && Math.abs(dx) > Math.min(W * .3, 160) && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swipe.done = true;
      if (dx < 0) { whoosh(false); go(nextIdx()); } else if (HIST.length) { whoosh(true); goBack(); }
    }
  }
  if (phase !== 'out' && cur.move) cur.move(p);
});
function release(e) {
  const p = P.get(e.pointerId);
  if (!p) { if (!started && e.type === 'pointerup') ignite(); return; }
  P.delete(e.pointerId); lastInput = T;
  if (P.size < 2) swipe = null;
  REC.end(p);
  if (cur && cur.up) cur.up(p);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('contextmenu', e => e.preventDefault());
// some browsers only unlock audio on a full click / touchend
const unlock = () => { if (started || ign >= 0) S.init(); };
addEventListener('touchend', unlock, { passive: true });
addEventListener('click', unlock);
addEventListener('keydown', e => { if (!started && (e.key === 'Enter' || e.key === ' ')) ignite(); });

document.getElementById('nx').addEventListener('click', e => { e.stopPropagation(); S.init(); if (started && phase === 'idle') { go(nextIdx()); S.note(mtof(74), { g: .04, d: 1.2 }); } });
document.getElementById('sd').addEventListener('click', e => { e.stopPropagation(); S.init(); const on = S.toggle(); e.currentTarget.classList.toggle('off', !on); });

let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { sizeCanvas(); if (cur && cur.resize) cur.resize(); }, 120); });

let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); document.title = cur && cur.hiddenTitle || 'come back'; saveMem(); }
  else {
    const away = (Date.now() - hiddenAt) / 1000;
    document.title = TITLE;
    if (S.c && S.c.state !== 'running') S.c.resume();
    last = performance.now();
    if (started && cur && cur.away) cur.away(away);
  }
});
if (document.fonts && document.fonts.load) document.fonts.load('italic 500 24px "Cormorant Garamond"').catch(() => {});
</script>
</body>
</html>
